<section class="panel is-on" id="panel-land" aria-labelledby="land-title">
          <p class="kicker">Plan your home</p>
          <h1 id="land-title" tabindex="-1">Do you have land?</h1>
          <p class="lede">If you don’t have land yet, that’s fine.</p>
          <p class="cheer" data-cheer></p>
          <div class="land-grid">
            <label class="choice">
              <input type="radio" name="land" value="yes">
              <span class="choice-face"><svg class="" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 35 L19 27 L41 30 L31 40 Z"/><path d="M7 35 V30 M41 30 V25 M31 40 V35"/><path d="M19 27 V11"/><path d="M19 11 L27 13.5 L19 16"/></svg><span><strong>I have land.</strong><small>A lot you own, or one under contract.</small></span></span>
            </label>
            <label class="choice">
              <input type="radio" name="land" value="no">
              <span class="choice-face"><svg class="" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 41 C 24 41 12 29.5 12 20 A 12 12 0 0 1 36 20 C 36 29.5 24 41 24 41 Z"/><path d="M20.6 17.4 A 3.6 3.6 0 1 1 25.4 20.8 C 24.4 21.3 24 22 24 23.2 V24"/><circle cx="24" cy="28" r="1.1" fill="currentColor" stroke="none"/></svg><span><strong>Still looking.</strong><small>Come back when you find a spot, or talk to us now. Daniel can often walk a lot with you before you buy.</small></span></span>
            </label>
            <label class="choice">
              <input type="radio" name="land" value="unsure">
              <span class="choice-face"><svg class="" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 43 V7"/><path d="M24 11 H36 L40 14.5 L36 18 H24"/><path d="M24 22 H12 L8 25.5 L12 29 H24"/><path d="M17 43 H31"/></svg><span><strong>I’m not sure.</strong><small>We can start either way.</small></span></span>
            </label>
          </div>
          <div class="actions">
            <button class="btn-ghost btn" type="button" data-go="back" disabled>Back</button>
            <button class="btn" type="button" data-go="next">Continue</button>
          </div>
          <p class="talk-exit"><a href="#contact" data-go="contact">Rather just talk? Contact Heartwood</a></p>
        </section>
